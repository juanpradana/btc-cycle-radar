[package]
name = "btc-cycle-radar"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "BTC Cycle Radar - Bitcoin long-cycle intelligence & valuation dashboard"
license = "MIT"

[dependencies]
# async runtime + web
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
axum = { version = "0.7", features = ["json", "query"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }

# storage
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate"] }

# http + parsing
reqwest = { version = "0.12", features = ["json", "gzip", "brotli"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# errors / time / logging / config
anyhow = "1.0"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "test-util"] }
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 1
incremental = true
